# AD-QS: автоматическая проверка безопасности (регламент QA_SECURITY_RU.md, ворота G1/G2/G5)
# Копируется в каждый репозиторий AD-* как .github/workflows/ad-security-scan.yml
# actions/* закреплены по полному SHA коммита (требование G5); при обновлении версии — новый SHA.

name: AD Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # каждый понедельник 03:00 UTC

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  OSV_SCANNER_VERSION: "2.7.0"
  SEMGREP_VERSION: "1.182.0"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (полная история для gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Подготовка папки отчётов
        run: mkdir -p audit-ci

      # --- Антивирус ---------------------------------------------------------
      - name: ClamAV — установка и обновление баз
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet

      - name: ClamAV — сканирование всего репозитория
        run: |
          clamscan --recursive --infected --suppress-ok-results \
            --exclude-dir='^\./\.git$' . | tee audit-ci/clamav.txt
          # код 1 = найден вирус → проверка падает

      # --- Утечки секретов ---------------------------------------------------
      - name: gitleaks — вся история git
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gl.tgz gitleaks
          ./gitleaks git . --redact --report-format json --report-path audit-ci/gitleaks.json

      # --- Уязвимости в зависимостях -----------------------------------------
      - name: osv-scanner — зависимости
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x osv-scanner
          ./osv-scanner scan source --recursive --format json --output audit-ci/osv.json . \
            || echo "::warning::osv-scanner нашёл уязвимости — разобрать по регламенту (Critical/High блокируют выпуск)"

      # --- Статический анализ ------------------------------------------------
      - name: semgrep — правила безопасности
        run: |
          pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep scan --metrics=off --config p/security-audit --config p/owasp-top-ten \
            --json --output audit-ci/semgrep.json --error --severity ERROR . \
            || echo "::warning::semgrep нашёл проблемы уровня ERROR — разобрать по регламенту"

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ad-security-reports
          path: audit-ci/
          retention-days: 90
